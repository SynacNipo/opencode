name: Merge PR into v2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "synacnipo@gmail.com"
          git config user.name "Synac"
          git remote add anomalyco https://github.com/anomalyco/opencode.git

      - name: Fetch PR
        run: |
          git fetch anomalyco pull/48908/head:pr-48908

      - name: Merge PR with theirs strategy
        run: |
          git merge pr-48908 --no-ff -X theirs -m "Merge PR #48908: fix(session): recover from stale encrypted reasoning on provider rejection"

      - name: Push
        run: |
          git push origin HEAD:v2
