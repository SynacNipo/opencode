name: Merge PR into v2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "synacnipo@gmail.com"
          git config user.name "Synac"
          git remote add anomalyco https://github.com/anomalyco/opencode.git

      - name: Fetch PR
        run: |
          git fetch anomalyco pull/48908/head:pr-48908

      - name: Check merge base
        run: |
          BASE=$(git merge-base v2 pr-48908 2>/dev/null || echo "none")
          echo "merge-base: $BASE"
          if [ "$BASE" = "none" ]; then
            echo "No common ancestor"
          fi

      - name: Merge PR
        run: |
          git merge pr-48908 --no-ff -m "Merge PR #48908: fix(session): recover from stale encrypted reasoning on provider rejection" || {
            echo "Merge conflicts detected"
            exit 1
          }

      - name: Push
        run: |
          git push origin HEAD:v2
