name: Merge PR into v2
on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "synacnipo@gmail.com"
          git config user.name "Synac"
          git remote add anomalyco https://github.com/anomalyco/opencode.git

      - name: Fetch PR
        run: |
          git fetch anomalyco pull/48908/head:pr-48908

      - name: Check merge base
        run: |
          BASE=$(git merge-base v2 pr-48908 2>/dev/null || echo "none")
          echo "merge-base: $BASE"
          if [ "$BASE" = "none" ]; then
            echo "No common ancestor, checking if PR base matches"
            git log --oneline -1 pr-48908^ 2>/dev/null || echo "no parent"
          fi

      - name: Merge PR
        run: |
          if git merge pr-48908 --no-ff -m "Merge PR #48908: fix(session): recover from stale encrypted reasoning on provider rejection"; then
            echo "Merge successful"
          else
            echo "Merge had conflicts, resolving..."
            git checkout --theirs packages/ai/src/index.ts packages/ai/src/provider-error.ts packages/ai/src/schema/errors.ts packages/ai/test/provider-error.test.ts packages/core/src/session/runner/llm.ts packages/core/src/session/runner/step.ts packages/core/test/session-runner.test.ts packages/core/test/session-step.test.ts 2>/dev/null || true
            git add packages/ai/src/index.ts packages/ai/src/provider-error.ts packages/ai/src/schema/errors.ts packages/ai/test/provider-error.test.ts packages/core/src/session/runner/llm.ts packages/core/src/session/runner/step.ts packages/core/test/session-runner.test.ts packages/core/test/session-step.test.ts 2>/dev/null || true
            git commit -m "Merge PR #48908: fix(session): recover from stale encrypted reasoning on provider rejection" || echo "Commit failed"
          fi

      - name: Push
        run: |
          git push origin HEAD:v2
