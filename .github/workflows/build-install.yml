name: Build OpenCode
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: cd packages/opencode && bun run build --skip-embed-web-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode
          path: packages/opencode/dist/opencode-windows-x64/bin/opencode
          if-no-files-found: error
