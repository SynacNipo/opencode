name: Build OpenCode
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or PR ref to build
        required: false
        default: v2

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: cd packages/opencode && bun run build --skip-embed-web-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode
          path: packages/opencode/dist/opencode-windows-x64/bin/
          if-no-files-found: error
