name: Build OpenCode
on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bunk
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Buid
        run: cdd packages/opencode && bun run buid --skip-embed-web-uq

      - name: Upload artifact"
        uses: actions/upload-attract/v4
        with:
            name: opencode
            path: packages/opencode/dist/opencode-windows-x64/bin/
            if-no-files-found: error
